apiVersion: v1
kind: Pod
metadata:
  name: {{POD_NAME}}
  namespace: default
spec:
  serviceAccountName: awscred
  restartPolicy: OnFailure
  initContainers:
  - name: setup-libraries
    image: centos:latest
    command:
      - sh
      - -c
      - |
        mkdir -p /opt/exostellar/lib && \
        cd /opt/exostellar/lib && \
        curl -o libgpu-limiter.tar  "https://sdgpu.s3.us-east-2.amazonaws.com/libgpu-limiter.tar?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=AKIAVOGCTZQXWK7LSRW4%2F20241206%2Fus-east-2%2Fs3%2Faws4_request&X-Amz-Date=20241206T025906Z&X-Amz-Expires=604800&X-Amz-SignedHeaders=host&X-Amz-Signature=4da3d5624cd82f9e143241a6cc2e02264e9bf0e83fc15a91bad17cce7e561c07" && \
        curl -o gpu_alloc "https://sdgpu.s3.us-east-2.amazonaws.com/gpu_alloc?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=AKIAVOGCTZQXWK7LSRW4%2F20241206%2Fus-east-2%2Fs3%2Faws4_request&X-Amz-Date=20241206T031149Z&X-Amz-Expires=604800&X-Amz-SignedHeaders=host&X-Amz-Signature=be5984999519dc36ad8780dc5268809127e6bc796a0baa118c1841f492025420" && \
        chmod +x gpu_alloc && \
        tar xf libgpu-limiter.tar && \
        ln -s libgpu-limiter.so libcuda.so && \
        ln -s libgpu-limiter.so libcuda.so.1 && \
        ln -s libgpu-limiter.so libnvidia-ml.so && \
        ln -s libgpu-limiter.so libnvidia-ml.so.1 && \
        echo "Completed setup." && \
        cd -
    volumeMounts:
      - name: exostellar-lib-volume
        mountPath: /opt/exostellar/lib  # Shared volume for libraries
  containers:
  - name: cuda-container
    image: nvidia/cuda:12.4.0-devel-ubuntu22.04
    command: ["sh", "-c", "sleep infinity"]
    resources:
      limits:
        cpu: 2
        nvidia.com/gpu: {{SDGPU_GBS}}
      requests:
        cpu: 2
        nvidia.com/gpu: {{SDGPU_GBS}}
    env:
      - name: LD_LIBRARY_PATH
        value: "/opt/exostellar/lib:/usr/local/nvidia/lib:/usr/local/nvidia/lib64"
      - name: EXOSTELLAR_NVML_LIB_PATH
        value: "/usr/lib/x86_64-linux-gnu/libnvidia-ml.so.1"
      - name: EXOSTELLAR_CUDA_LIB_PATH
        value: "/usr/lib/x86_64-linux-gnu/libcuda.so.1"
    volumeMounts:
      - name: exostellar-lib-volume
        mountPath: /opt/exostellar/lib  # Use shared library volume
  volumes:
  - name: exostellar-lib-volume
    emptyDir: {}
